<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GAO Research AI</title>
<style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9eefb;background:#0a1224}*{box-sizing:border-box}body{margin:0}header{padding:22px 6%;background:#101d35;border-bottom:1px solid #283653}h1{font-size:26px;margin:0}header p{color:#a5b6d3;margin:6px 0 0}main{max-width:1050px;margin:30px auto;padding:0 20px}.card{background:#15233d;border:1px solid #2b3d5c;border-radius:18px;padding:24px;margin:18px 0}h2{font-size:20px;margin:0 0 18px}label{display:block;margin:15px 0 6px;color:#d1def5}input,textarea,select{width:100%;background:#0c172c;color:white;border:1px solid #3a5072;border-radius:9px;padding:12px;font-size:16px}textarea{min-height:85px}button{background:#c9a55d;color:#101625;border:0;padding:12px 18px;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;margin:12px 8px 0 0}button:disabled{opacity:.5}.hint,small{color:#a8b9d5;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.item{border-top:1px solid #334662;padding:14px 0}.item a{color:#a7d1ff;overflow-wrap:anywhere}.tag{display:inline-block;background:#273a59;color:#e6d3a6;border-radius:7px;padding:3px 7px;font-size:12px;margin-right:6px}.muted{color:#b5c3db}#status{min-height:20px}footer{padding:25px;text-align:center;color:#8295b5}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:17px}}</style></head>
<body><header><h1>GAO Research AI</h1><p>글로벌 학술자료 검색 · 무료 웹 리서치 · TXT 연구노트</p></header>
<main><section class="card"><h2>새 연구 시작</h2><label>연구 주제 / 검색 키워드</label><input id="q" placeholder="예: 생성형 AI, 반도체, 의료관광"><label>연구 질문 / 부제</label><textarea id="question" placeholder="예: 생성형 AI가 산업 생산성에 미치는 영향을 비교 분석"></textarea><div class="grid"><div><label>희망 분량 (페이지)</label><input id="pages" type="number" min="1" max="100" value="10"></div><div><label>검색 자료 수</label><select id="limit"><option value="10">10건</option><option value="20" selected>20건</option><option value="40">40건</option></select></div></div><button id="run">무료 학술자료 검색</button><button id="web">일반 웹 검색 열기</button><p class="hint">OpenAlex·Crossref 공개 API를 사용합니다. 일반 인터넷 검색 버튼은 별도 검색 사이트를 엽니다. AI 자동 집필이나 웹 전체 자동 수집은 제공하지 않습니다.</p><p id="status" aria-live="polite"></p></section>
<section class="card"><h2>검색 결과 <span id="count" class="muted"></span></h2><div id="results" class="muted">검색을 시작하면 논문과 출처가 여기에 표시됩니다.</div><button id="download" disabled>텍스트(.txt) 다운로드</button><p class="hint">UTF-8 텍스트(.txt) 파일로 저장합니다. 실제 논문 내용은 원문에서 검증해 주세요.</p></section></main><footer>GAO Research AI · Free Static Edition · GitHub Pages</footer>
<script>
const $=id=>document.getElementById(id);let papers=[];
const clean=s=>String(s||"").replace(/<[^>]*>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">");
function abstract(w){const x=w.abstract_inverted_index;if(!x)return "";const a=[];for(const [word,positions] of Object.entries(x))for(const p of positions)a[p]=word;return a.join(" ").slice(0,1100)}
function safeUrl(s){try{let u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
function display(){const box=$("results");box.replaceChildren();$("count").textContent="("+papers.length+"건)";for(const [i,p] of papers.entries()){const el=document.createElement("div");el.className="item";const title=document.createElement("strong");title.textContent=(i+1)+". "+p.title;el.append(title);const meta=document.createElement("p");meta.className="muted";meta.textContent=[p.year,p.source,p.authors].filter(Boolean).join(" · ");el.append(meta);const tag=document.createElement("span");tag.className="tag";tag.textContent=p.kind;el.append(tag);if(p.url){const a=document.createElement("a");a.href=p.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent="원문/출처 열기";el.append(a)}if(p.abstract){const d=document.createElement("p");d.textContent=p.abstract;el.append(d)}box.append(el)}$("download").disabled=!papers.length}
async function search(){let q=$("q").value.trim();if(!q){$("status").textContent="검색어를 입력하세요.";return}papers=[];$("run").disabled=true;$("status").textContent="OpenAlex 및 Crossref 검색 중…";const n=Number($("limit").value);const errors=[];const jobs=[fetch("https://api.openalex.org/works?search="+encodeURIComponent(q)+"&per-page="+n).then(r=>{if(!r.ok)throw Error("OpenAlex HTTP "+r.status);return r.json()}).then(d=>(d.results||[]).map(w=>({kind:"OpenAlex",title:w.display_name||"",year:w.publication_year,source:w.primary_location?.source?.display_name||"",authors:(w.authorships||[]).slice(0,3).map(a=>a.author?.display_name).join(", "),url:safeUrl(w.doi||w.primary_location?.landing_page_url||""),abstract:abstract(w)}))).catch(e=>{errors.push(e.message);return []}),fetch("https://api.crossref.org/works?query="+encodeURIComponent(q)+"&rows="+n).then(r=>{if(!r.ok)throw Error("Crossref HTTP "+r.status);return r.json()}).then(d=>(d.message?.items||[]).map(w=>({kind:"Crossref",title:clean(w.title?.[0]||""),year:w.published?.["date-parts"]?.[0]?.[0]||"",source:w["container-title"]?.[0]||"",authors:(w.author||[]).slice(0,3).map(a=>[a.given,a.family].filter(Boolean).join(" ")).join(", "),url:safeUrl(w.URL||""),abstract:clean(w.abstract||"").slice(0,1100)}))).catch(e=>{errors.push(e.message);return []})];const rows=(await Promise.all(jobs)).flat();const seen=new Set();papers=rows.filter(p=>{const k=(p.url||p.title).toLowerCase();if(!p.title||seen.has(k))return false;seen.add(k);return true});display();$("status").textContent=papers.length+"건 검색 완료"+(errors.length?" · 일부 API 오류: "+errors.join(", "):"");$("run").disabled=false}
$("run").onclick=search;$("web").onclick=()=>{const q=$("q").value.trim();if(q)window.open("https://www.google.com/search?q="+encodeURIComponent(q),"_blank","noopener");else $("status").textContent="검색어를 입력하세요."};
$("download").onclick=()=>{if(!papers.length)return;const date=new Date().toLocaleDateString("ko-KR");const lines=["GAO Research AI · 연구자료 노트","작성일: "+date,"","연구 주제: "+$("q").value,"연구 질문: "+$("question").value,"희망 분량: "+$("pages").value+"페이지 (자동 분량 생성 아님)","","===== 참고자료 목록 =====","",...papers.flatMap((p,i)=>[(i+1)+". "+p.title,[p.authors,p.year,p.source,p.kind].filter(Boolean).join(" · "),"출처: "+p.url,p.abstract||"",""]),"주의: 본 문서는 출처 검색 결과를 정리한 연구노트이며 AI 검증 학술보고서가 아닙니다."];const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/plain;charset=utf-8"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="GAO_Research_Notes.txt";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
